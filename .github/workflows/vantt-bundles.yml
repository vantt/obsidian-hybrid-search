name: vantt-bundles

# Prebuilt, self-contained OHS bundles for one fork release tag (PRD 7.3, 8):
# build on each platform's native runner, smoke test the bundle on a runner that
# only has the archive (no setup-node), then attach bundles and checksums to the
# GitHub Release for the tag. Not signed on macOS (PRD 8.3, Q4).
#
# There is no push-tag trigger on purpose: a tag start would run the workflow file
# of the tagged commit, but release branches carry no .github/workflows (upstream's
# are removed), and tags pushed with GITHUB_TOKEN start nothing anyway. Run it from
# master: dispatch with the tag, or call it from catchup (workflow_call).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Fork release tag, e.g. v0.17.2-vantt.1'
        required: true
      only:
        description: 'Set to pin-effect to run only that check (measurement, no build, smoke or publishing)'
        required: false
        default: ''
      reuse_run:
        description: 'Run id of an earlier vantt-bundles run: skip the build and re-test/re-release its bundle artifacts'
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        description: 'Fork release tag'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vantt-bundles-${{ inputs.tag || github.ref_name }}${{ inputs.only && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

env:
  HUSKY: '0'
  GH_TOKEN: ${{ secrets.VANTT_PUSH_TOKEN || github.token }}
  # gh would otherwise resolve this fork's parent (flowing-abyss) as the default repo.
  GH_REPO: ${{ github.repository }}
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    if: github.repository == 'vantt/obsidian-hybrid-search'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate tag and make sure the release exists
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-vantt\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a fork release tag (v<semver>-vantt.<N>)"
            exit 1
          fi
          git ls-remote --exit-code --tags "https://github.com/$GH_REPO" "refs/tags/$TAG" >/dev/null \
            || { echo "::error::tag $TAG does not exist on $GH_REPO"; exit 1; }
          # Not marked latest until every platform has passed (done in the release job).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --latest=false --title "OHS ${TAG#v}" \
              --notes "Bundles for $TAG are being built: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

  bundle:
    needs: prepare
    if: ${{ inputs.reuse_run == '' && inputs.only == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
          - platform: darwin-arm64
            runner: macos-14
          # onnxruntime-node 1.30 ships no darwin/x64 binding; bundle.mjs substitutes the newest version
          # that has one (PLATFORM_PINS) for this platform only, and the parity job checks the result.
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # The release tree is the tag; the scripts and smoke vault come from master.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
          path: tree
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          path: tools
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: tree/.node-version
          cache: ''

      # Upstream refuses other npm versions (devEngines.packageManager).
      - name: Pin npm 12.2.0
        run: npm install -g npm@12.2.0 && npm --version

      - name: Build bundle
        run: |
          node tools/vantt/scripts/bundle.mjs --platform "${{ matrix.platform }}" --tree tree \
            --out "$RUNNER_TEMP/out" --work "$RUNNER_TEMP/w" --json > "$RUNNER_TEMP/bundle-result.json"
          ls -l "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  smoke:
    needs: [prepare, bundle, pin-effect]
    if: ${{ !cancelled() && inputs.only == '' && needs.prepare.result == 'success' && (needs.bundle.result == 'success' || needs.bundle.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
          - platform: darwin-arm64
            runner: macos-14
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # No setup-node and no npm: the bundle must run on its own Node. The runner's
      # own Node only drives the test script.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          path: tools
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/in
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ secrets.VANTT_PUSH_TOKEN || github.token }}

      # A reused run keeps its artifacts in that run; the release job reads this run's.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ inputs.reuse_run != '' }}
        with:
          name: bundle-${{ matrix.platform }}
          path: ${{ runner.temp }}/in/*
          if-no-files-found: error

      # The model is downloaded on the first run (about 120 MB) and cached after.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: vantt-hf-model-${{ runner.os }}-e5-small-v1

      - name: Smoke test
        run: |
          archive=$(find "$RUNNER_TEMP/in" -maxdepth 1 \( -name 'ohs-*.zip' -o -name 'ohs-*.tar.gz' \) | head -n1)
          [ -n "$archive" ] || { echo "::error::no bundle archive in the downloaded artifact"; exit 1; }
          node tools/vantt/scripts/bundle-smoke.mjs --archive "$archive" --work "$RUNNER_TEMP/smoke" \
            --out "$RUNNER_TEMP/smoke.json" > /dev/null

      - name: Smoke report
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/smoke.json" ] || exit 0
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const out = ["### Smoke " + r.platform + ": " + (r.ok ? "pass" : "FAIL"), "",
              "unpacked " + (r.size_unpacked / 1e6).toFixed(1) + " MB, index " + (r.index_ms / 1000).toFixed(1) + " s, db " + r.db_size_mb + " MB, Hit@5 " + r.hit5, ""];
            for (const c of r.checks || []) out.push("- " + (c.ok ? "pass" : "FAIL") + " " + c.name + (c.ok ? "" : ": " + c.detail));
            console.log(out.join("\n"));
          ' "$RUNNER_TEMP/smoke.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-${{ matrix.platform }}
          path: ${{ runner.temp }}/smoke.json
          if-no-files-found: ignore

      # Each platform publishes its own asset: a failure on one platform never holds back the others.
      # darwin-x64 also needs the pin-effect check (job pin-effect) to have passed.
      - name: Upload this platform's bundle to the release
        if: ${{ success() && (matrix.platform != 'darwin-x64' || needs.pin-effect.outputs.ok == 'true') }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/in/ohs-* --clobber

      - name: Fail visibly when the pin-effect check did not pass
        if: ${{ success() && matrix.platform == 'darwin-x64' && needs.pin-effect.outputs.ok != 'true' }}
        run: |
          echo "::error::darwin-x64 was not published: onnxruntime-node 1.23.2 changes nDCG@5 by more than 0.01 against 1.30.0 on the same machine (see job pin-effect)"
          exit 1

  # Effect of the pinned onnxruntime-node on search quality: one machine, one run, the same release tree, locked
  # 1.30.0 against the 1.23.2 that the darwin-x64 bundle ships (PRD 8.4, step 6). The numbers of quantised ONNX
  # models depend on the runner's CPU, so the check only counts on the CPU class it was calibrated
  # on (AMD EPYC); another class retries on a fresh runner, up to three attempts.
  pe1:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: ./.github/workflows/vantt-pin-effect.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      attempt: 1
  pe2:
    needs: [prepare, pe1]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.pe1.outputs.inconclusive == 'true' }}
    uses: ./.github/workflows/vantt-pin-effect.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      attempt: 2
  pe3:
    needs: [prepare, pe2]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.pe2.outputs.inconclusive == 'true' }}
    uses: ./.github/workflows/vantt-pin-effect.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      attempt: 3

  # The verdict used to publish darwin-x64: the first attempt that ran on the reference CPU class.
  # Without one (three other CPUs in a row) the verdict is "not ok" and says so.
  pin-effect:
    needs: [pe1, pe2, pe3]
    if: ${{ !cancelled() && needs.pe1.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.verdict.outputs.ok }}
    steps:
      - id: verdict
        env:
          O1: ${{ needs.pe1.outputs.inconclusive }}
          K1: ${{ needs.pe1.outputs.ok }}
          O2: ${{ needs.pe2.outputs.inconclusive }}
          K2: ${{ needs.pe2.outputs.ok }}
          O3: ${{ needs.pe3.outputs.inconclusive }}
          K3: ${{ needs.pe3.outputs.ok }}
        run: |
          ok=false
          if [ "$O1" = false ]; then ok=$K1
          elif [ "$O2" = false ]; then ok=$K2
          elif [ "$O3" = false ]; then ok=$K3
          else echo "::error::the pin-effect check never ran on an AMD EPYC runner (3 attempts); darwin-x64 is not published"; fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "pin-effect verdict: ok=$ok" >> "$GITHUB_STEP_SUMMARY"

  # The Intel bundle's own eval numbers on its own platform: its per-platform baseline (informational).
  eval-darwin-x64:
    needs: prepare
    if: ${{ !cancelled() && inputs.only == '' && needs.prepare.result == 'success' }}
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}
          path: tree
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          path: tools
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: tree/.node-version
          cache: ''
      - name: Pin npm 12.2.0
        run: npm install -g npm@12.2.0 && npm --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: vantt-hf-model-${{ runner.os }}-e5-small-v1
      - name: Install the release tree and build the Vietnamese pack
        run: |
          set -euo pipefail
          (cd tree && npm ci --ignore-scripts --no-audit --no-fund)
          # onnxruntime-node's install script downloads binaries and fails on network hiccups
          for attempt in 1 2 3; do (cd tree && npm rebuild) && break; [ "$attempt" = 3 ] && exit 1; sleep 15; done
          cp -R tree/vantt/packages/ohs-lang-vi "$RUNNER_TEMP/ohs-lang-vi"
          (cd "$RUNNER_TEMP/ohs-lang-vi" && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          # the tag is the one run-eval.mjs and the committed golden set were generated with
          fixture_tag=$(grep -m1 '^const FIXTURE_TAG' tools/vantt/eval/vi/run-eval.mjs | cut -d"'" -f2)
          [ -n "$fixture_tag" ] || { echo "::error::no FIXTURE_TAG in run-eval.mjs"; exit 1; }
          git clone --quiet --depth 1 --branch "$fixture_tag" https://github.com/vantt/obsidian-test-fixture "$RUNNER_TEMP/otf"
      - name: Eval with the bundle's dependencies
        run: |
          node tools/vantt/scripts/bundle-parity.mjs run --tree tree --out "$RUNNER_TEMP/eval" \
            --lang-pack "$RUNNER_TEMP/ohs-lang-vi" --otf "$RUNNER_TEMP/otf/bin/otf.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-darwin-x64
          path: |
            ${{ runner.temp }}/eval/obsidian-help.json
            ${{ runner.temp }}/eval/vi.json
          if-no-files-found: error

  # Release notes, and `latest` once every platform has published.
  finalize:
    needs: [prepare, smoke, pin-effect]
    if: ${{ !cancelled() && inputs.only == '' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          path: tools
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Write notes
        env:
          ALL_OK: ${{ needs.smoke.result == 'success' && needs.pin-effect.outputs.ok == 'true' }}
          PIN_OK: ${{ needs.pin-effect.outputs.ok == 'true' }}
        run: |
          set -euo pipefail
          find artifacts -type f | sort
          args=(--dir artifacts --tag "$TAG")
          for f in artifacts/pin-effect-*/pin-effect.md; do [ -f "$f" ] && args+=(--parity "$f"); done
          [ "$PIN_OK" = true ] || args+=(--hold darwin-x64)
          node tools/vantt/scripts/bundle-notes.mjs "${args[@]}" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$ALL_OK" = true ]; then gh release edit "$TAG" --notes-file notes.md --latest
          else gh release edit "$TAG" --notes-file notes.md; fi
