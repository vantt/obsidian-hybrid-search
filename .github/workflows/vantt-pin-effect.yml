name: vantt-pin-effect

# One attempt of the pin-effect check (PRD 8.4, step 6), called by vantt-bundles.yml. Evaluates the release tree
# twice on this runner, with locked onnxruntime-node and with the darwin-x64 pins, and compares nDCG@5 per category.
# The numbers depend on the CPU class: the check was calibrated on AMD EPYC, so on another CPU the attempt
# is "inconclusive" and the caller retries on a fresh runner.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Fork release tag'
        required: true
        type: string
      attempt:
        description: 'Attempt number (artifact name suffix)'
        required: true
        type: number
    outputs:
      ok:
        description: 'true when no category regresses beyond the rule (vantt/scripts/lib/parity-rule.mjs)'
        value: ${{ jobs.pin-effect.outputs.ok }}
      inconclusive:
        description: 'true when the runner CPU is not the reference class'
        value: ${{ jobs.pin-effect.outputs.inconclusive }}

permissions:
  contents: read

env:
  HUSKY: '0'
  TAG: ${{ inputs.tag }}

jobs:
  pin-effect:
    if: github.repository == 'vantt/obsidian-hybrid-search'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      ok: ${{ steps.compare.outputs.ok || 'false' }}
      inconclusive: ${{ steps.cpu.outputs.inconclusive }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Runner CPU
        id: cpu
        run: |
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)
          echo "CPU: $model"
          echo "### Pin effect, attempt ${{ inputs.attempt }}: $model" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$model" == *"AMD EPYC"* ]]; then echo "inconclusive=false" >> "$GITHUB_OUTPUT"
          else
            echo "inconclusive=true" >> "$GITHUB_OUTPUT"
            echo "Not the reference CPU class (AMD EPYC); this attempt is inconclusive." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.cpu.outputs.inconclusive == 'false'
        with:
          ref: refs/tags/${{ env.TAG }}
          path: tree
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.cpu.outputs.inconclusive == 'false'
        with:
          ref: master
          path: tools
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.cpu.outputs.inconclusive == 'false'
        with:
          node-version-file: tree/.node-version
          cache: ''
      - name: Pin npm 12.2.0
        if: steps.cpu.outputs.inconclusive == 'false'
        run: npm install -g npm@12.2.0 && npm --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.cpu.outputs.inconclusive == 'false'
        with:
          path: ~/.cache/huggingface
          key: vantt-hf-model-${{ runner.os }}-e5-small-v1
      - name: Install the release tree and build the Vietnamese pack
        if: steps.cpu.outputs.inconclusive == 'false'
        run: |
          set -euo pipefail
          (cd tree && npm ci --ignore-scripts --no-audit --no-fund)
          # onnxruntime-node's install script downloads binaries and fails on network hiccups
          for attempt in 1 2 3; do (cd tree && npm rebuild) && break; [ "$attempt" = 3 ] && exit 1; sleep 15; done
          cp -R tree/vantt/packages/ohs-lang-vi "$RUNNER_TEMP/ohs-lang-vi"
          (cd "$RUNNER_TEMP/ohs-lang-vi" && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          # npm 12 refuses git dependencies (EALLOWGIT), so the corpus generator (no dependencies of its own) is cloned.
          # the tag is the one run-eval.mjs and the committed golden set were generated with
          fixture_tag=$(grep -m1 '^const FIXTURE_TAG' tools/vantt/eval/vi/run-eval.mjs | cut -d"'" -f2)
          [ -n "$fixture_tag" ] || { echo "::error::no FIXTURE_TAG in run-eval.mjs"; exit 1; }
          git clone --quiet --depth 1 --branch "$fixture_tag" https://github.com/vantt/obsidian-test-fixture "$RUNNER_TEMP/otf"
      # The locked run goes first: the pinned run replaces files in the tree's dependencies and they stay replaced.
      - name: Eval with the locked dependencies
        if: steps.cpu.outputs.inconclusive == 'false'
        run: |
          node tools/vantt/scripts/bundle-parity.mjs run --tree tree --out "$RUNNER_TEMP/locked" \
            --lang-pack "$RUNNER_TEMP/ohs-lang-vi" --otf "$RUNNER_TEMP/otf/bin/otf.mjs"
      - name: Eval with the darwin-x64 pins
        if: steps.cpu.outputs.inconclusive == 'false'
        run: |
          node tools/vantt/scripts/bundle-parity.mjs run --tree tree --out "$RUNNER_TEMP/pinned" --pins-of darwin-x64 \
            --lang-pack "$RUNNER_TEMP/ohs-lang-vi" --otf "$RUNNER_TEMP/otf/bin/otf.mjs"
      - name: Compare
        id: compare
        if: steps.cpu.outputs.inconclusive == 'false'
        run: |
          rc=0
          node tools/vantt/scripts/bundle-parity.mjs compare --ref "$RUNNER_TEMP/locked" --other "$RUNNER_TEMP/pinned" \
            --tolerance 0.01 --regressions-only --out "$RUNNER_TEMP/pin-effect.json" > "$RUNNER_TEMP/pin-effect.md" || rc=$?
          cat "$RUNNER_TEMP/pin-effect.md"
          { echo "(locked onnxruntime-node against the darwin-x64 pins, same machine)"; echo; cat "$RUNNER_TEMP/pin-effect.md"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" = 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.cpu.outputs.inconclusive == 'false'
        with:
          name: pin-effect-${{ inputs.attempt }}
          path: |
            ${{ runner.temp }}/pin-effect.md
            ${{ runner.temp }}/pin-effect.json
          if-no-files-found: ignore
